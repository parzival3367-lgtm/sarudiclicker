<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="animation.css" />
    <title>Sarudi Clicker</title>
    <link rel="icon" type="image/png" href="assets/sarudi.png">
  </head>
  <body oncontextmenu="return false;">
    <div id="golden-sarudi-layer"></div>
    <section>
      <div class="main">
        <div class="left">
          <p>Sarudi Bucks <br /><span class="sarudi-cost brown-text">0</span></p>
          <div class="sarudi-img-container">
            <img
              src="./assets/sarudi.png"
              alt=""
              class="sarudi-image"
              onclick="incrementBuck(event)"
              draggable="false"
            />
          </div>
        </div>

        <script id="upgrade-template" type="text/template">
          <div class="upgrade type-{{type}}" onclick="buyUpgrade('{{name}}')" id="{{name}}-upgrade">
            <div class="left-section">
              <img
                src="{{image}}"
                alt=""
                class="upgrade-img"
              />
            </div>
            <div class="mid-section">
              <h4>{{name}}</h4>
              <div class="cost-info">
                <p class="cost-text"><span class="{{name}}-cost">{{cost}}</span></p>
                <img src="/assets/sarudi.png" alt="" class="sarudi-img" />
              </div>
            </div>
            <div class="right-section">Level <span class="{{name}}-level">0</span></div>

            <div class="next-level-info" id="{{name}}-next-level">
              <p id="{{name}}-next-p">
                +<span class="{{name}}-increase">{{increase}}</span> Sarudi Bucks <br /> per click
              </p>
            </div>
          </div>
        </script>

        <div class="right">
          <div class="right-navbar">
            <div id="upgrades-nav-button">Upgrade</div>
            <div id="skills-nav-button">Skills</div>
            <div id="artifacts-nav-button">Artifacts</div>
          </div>

          <div id="upgrades-container"></div>
        </div>
      </div>

      <div class="statistics">
        <div class="texts">
          <p>SBC: <span id="sbc-text" class="brown-text">1</span></p>
          <p>SBS: <span id="sbs-text" class="brown-text">0</span></p>
        </div>
      </div>

      <div class="util-buttons">
        <button class="util-button prestige-button" onclick="prestige()">Prestige</button>
        <button class="util-button" onclick="save()">Save</button>
        <button class="util-button" onclick="load()">Load</button>
        <button id="music-button" class="util-button" onclick="playMusic()">Play Music</button>
      </div>

      <div class="relic">
        <span>Relic: <span id="relic">0</span></span>
        <button class="admin-easter-egg" type="button" onclick="adminPassword()" aria-label="Admin panel">Admin</button>
      </div>
      <div class="last-save">
        Last Save: <span id="last-save-text">Never</span>
        </div>
    </section>

    <dialog id="admin-password-dialog" class="admin-dialog" aria-labelledby="admin-password-title">
      <form id="admin-password-form">
        <h2 id="admin-password-title">Admin password</h2>
        <label for="admin-password">Enter the admin password to continue.</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required />
        <p id="admin-password-error" class="admin-password-error" role="alert" hidden></p>
        <div class="admin-dialog-actions">
          <button id="admin-password-cancel" class="util-button" type="button">Cancel</button>
          <button class="util-button" type="submit">Continue</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="index.js"></script>
  </body>
</html>
