<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige</title>
</head>
<body class="prestige-page">
  <h1>Prestige</h1>
  <div class="relics-info">
    <p>You have gained <span id="relics-earned">0</span> relics from your prestige.</p>
  </div>
  <div class="prestige-actions">
    <button id="prestige-back" class="util-button" type="button">Back to Game</button>
  </div>
  <div class="prestige-upgrades">
    <div class="prestige-upgrade" id="prestige-upgrade-1">
      <h3>Prestige Upgrade 1</h3>
      <p>Cost: <span class="prestige-upgrade-cost">1</span> relics</p>
      <button class="prestige-upgrade-button" type="button">Purchase</button>
    </div>
  </div>  
</body>
</html>
